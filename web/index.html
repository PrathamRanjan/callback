<!doctype html>
<html lang="en-AU">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f4f1ea" />
    <meta name="description" content="Callback phones your customers about deposits, overdue invoices and cancelled classes, and settles each one through PayPal. The AI talks; rules decide what money may move." />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>Callback: the money calls, made for you</title>
    <script>
      (function () {
        try {
          var p = localStorage.getItem("cb-theme");
          var d = p === "dark" || (p !== "light" && matchMedia("(prefers-color-scheme: dark)").matches);
          if (d) { document.documentElement.classList.add("dark"); document.querySelector('meta[name="theme-color"]').setAttribute("content", "#111311"); }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>Callback needs JavaScript for this view. The plain version is at <a href="/today?classic=1">/today?classic=1</a>.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
